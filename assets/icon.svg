<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Loco Chicken">
  <!-- App-Icon im Stil des Marken-Badges: gelber Kreis, roter Ring, Hahn mit Sonnenbrille.
