    stroke-linejoin="round"
  />

  <!-- Kopf -->
  <ellipse cx="256" cy="256" rx="112" ry="106" fill="#B0672F" stroke="#12100E" stroke-width="12" />

  <!-- Kehllappen -->
  <path
    d="M232 330 c-16 26 4 46 24 40 20-6 24-30 12-46 z"
    fill="#D91F26"
