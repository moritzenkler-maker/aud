  <circle cx="256" cy="256" r="228" fill="#FFDD00" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="#D91F26" stroke-width="14" />

  <g transform="translate(256 262) scale(0.82) translate(-256 -256)">
  <!-- Kamm -->
  <path
    d="M188 150 c-6-44 18-58 30-40 4-40 34-44 44-20 14-30 44-26 48 4 22-18 44 0 34 34 z"
    fill="#D91F26"
    stroke="#12100E"
