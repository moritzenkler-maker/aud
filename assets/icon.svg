  <path d="M206 306 h108 c-14 16-38 24-60 24 -22 0-38-8-48-24 z" fill="#FFFFFF" />
  <path d="M236 306 v22 M266 306 v24 M296 306 v18" stroke="#12100E" stroke-width="7" />
